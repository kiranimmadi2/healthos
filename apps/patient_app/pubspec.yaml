name: patient_app
description: HealthOS Patient App - iOS, Android, Web
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.7

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Shared packages
  core:
    path: ../../packages/core
  ui_kit:
    path: ../../packages/ui_kit
  supabase_client:
    path: ../../packages/supabase_client
  ai_client:
    path: ../../packages/ai_client

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Utilities
  fpdart: ^1.1.0
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  mobile_scanner: ^5.1.1
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.7
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

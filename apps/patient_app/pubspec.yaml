name: patient_app
description: HealthOS Patient App - iOS, Android, Web
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.0.0

  # Shared packages
  core:
  ui_kit:
  supabase_client:
  ai_client:

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Utilities
  fpdart: ^1.1.0
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  mobile_scanner: ^5.1.1
  permission_handler: ^11.3.0
  supabase_flutter: ^2.12.4
  file_picker: ^8.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.7
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

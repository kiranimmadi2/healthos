# ============================================================================
# HealthOS - Local Development Environment
# ============================================================================
#
# Microservices Architecture:
#
#   Flutter Apps (4)
#        |
#        v
#   Supabase Kong (API Gateway) :8000
#        |
#   +----+----+----+----+----+
#   |    |    |    |    |    |
#   v    v    v    v    v    v
# Auth  Patient Clinical Appt AI  Notification
# Svc   Svc     Svc     Svc  Svc  Svc
#   |    |       |       |    |    |
#   +----+-------+-------+----+----+
#        |                     |
#        v                     v
#   PostgreSQL DB         Anthropic API
#        |
#        v
#   Supabase Storage
#
# Edge Functions (Microservices):
#   patient-service      → Patient CRUD, profiles, access grants
#   clinical-service     → Visits, lab reports, biomarkers, prescriptions
#   appointment-service  → Scheduling, availability, conflict detection
#   ai-service           → Symptom triage, health summaries, OCR
#   notification-service → Push notifications, in-app, bulk messaging
#
# Run: docker-compose up -d
# ============================================================================

version: '3.8'

services:
  supabase-db:
    image: supabase/postgres:15.1.1.61
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  supabase-studio:
    image: supabase/studio:20240101-ce42139
    ports:
      - "54323:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: postgres
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_REST_URL: http://supabase-kong:8000/rest/v1/
    depends_on:
      supabase-db:
        condition: service_healthy

volumes:
  supabase-db-data:
